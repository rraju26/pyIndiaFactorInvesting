[project]
name = "pyindiafactorinvesting"
version = "0.1.0"
description = "Educational notebooks on factor investing in Indian equity and fixed-income markets."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "indiafactorlibrary",
    "pandas>=2,<3",
    "numpy<2",  # match the tested combination (pandas 2.x + numpy 1.26); lift deliberately
    "statsmodels",
    "matplotlib",
    "scipy",
    "jupyter",
]

# This is a notebooks repo, not a distributable package: the notebooks add the
# repo root to sys.path and import `src` directly. Tell uv to manage the
# environment and dependencies without trying to build/install the project.
[tool.uv]
package = false
